unbind r
bind r source-file ~/.tmux.conf

# Enable mouse Scroll
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g renumber-windows on

# Enable full colors
set -g default-terminal "tmux-256color"

# Allow image pass-through
set -g allow-passthrough on

# Set prefix to Ctrl-a (which is hyper f bc of karabiner)
set -g prefix M-f

# Set new window to start in the current path
bind c new-window -c "#{pane_current_path}"

bind -n M-h select-window -p
bind -n M-l select-window -n

# Top status bar
set-option -g status-position top
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# tokyo night theme
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
# ~/.tmux.conf

# Options to make tmux more pleasant

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g @plugin 'tmux-plugins/tmux-cpu'

# Resurrect and Continuum to save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Or, if using TPM, just run TPM

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default
